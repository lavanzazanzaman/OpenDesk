name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable app and AppImage
        run: ./tools/build-appimage.sh
      - name: Checksums
        run: cd dist && sha256sum OpenDesk-Linux-x86_64.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/OpenDesk-Linux-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nsis
      - name: Configure and build
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j"$(nproc)"
      - name: Stage dependencies
        run: tools/package-windows.sh build-win
      - name: Build installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION=1.0
          cd tools/windows
          makensis -DAPP_VERSION="$VERSION" -DSTAGE_DIR="../../dist/OpenDesk" installer.nsi
      - name: Build portable ZIP
        run: |
          cd dist
          powershell.exe -NoProfile -Command "Compress-Archive -Path OpenDesk -DestinationPath OpenDesk-Windows-x86_64.zip -Force"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/OpenDesk-Windows-x86_64-Setup.exe
            dist/OpenDesk-Windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/linux-appimage/OpenDesk-Linux-x86_64.AppImage release/
          cp artifacts/linux-appimage/SHA256SUMS release/
          cp artifacts/windows-installer/OpenDesk-Windows-x86_64-Setup.exe release/
          cp artifacts/windows-installer/OpenDesk-Windows-x86_64.zip release/
          (cd release && sha256sum OpenDesk-Windows-x86_64-Setup.exe OpenDesk-Windows-x86_64.zip >> SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
