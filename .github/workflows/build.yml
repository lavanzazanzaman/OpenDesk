name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config qt6-base-dev qt6-wayland \
            libssl-dev liblz4-dev libevdev-dev libpulse-dev libpipewire-0.3-dev \
            libavcodec-dev libavfilter-dev libavutil-dev libavformat-dev libswscale-dev \
            libwayland-dev wayland-protocols plasma-wayland-protocols libgbm-dev \
            libegl-dev libgles-dev libvulkan-dev glslc libopenxr-dev libfmt-dev \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev
      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci -j"$(nproc)"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-openssl
      - name: Configure and build
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j"$(nproc)"
      - name: Stage dependencies
        run: tools/package-windows.sh build-win
